x1="60"
y1="82"
x2="1140"
y2="82"
stroke="#30363D"/>

<text
x="600"
y="175"
text-anchor="middle"
class="title"
filter="url(#glow)">
VAIBH37
</text>

<text
x="600"
y="218"
