/>

<rect
x="0"
y="-30"
width="1200"
height="3"
fill="url(#scanGradient)"
filter="url(#strongGlow)"
class="scan"
/>

<rect
x="1"
y="1"
width="1198"
height="418"
rx="23"
fill="none"
