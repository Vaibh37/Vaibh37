<svg width="1200" height="420" viewBox="0 0 1200 420"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420">
    <stop offset="0%" stop-color="#030712"/>
    <stop offset="45%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#071829"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="scanGradient">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#58A6FF"/>
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path
      d="M40 0H0V40"
      fill="none"
      stroke="#58A6FF"
      stroke-width="1"
      opacity=".06"
    />
  </pattern>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<style>

.title {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 78px;
  font-weight: 800;
  letter-spacing: 10px;
  fill: #FFFFFF;
}

.subtitle {
  font-family: monospace;
  font-size: 18px;
  letter-spacing: 5px;
  fill: #58A6FF;
}

.small {
  font-family: monospace;
  font-size: 14px;
  fill: #8B949E;
}

.green {
  font-family: monospace;
  font-size: 14px;
  fill: #3FB950;
}

.scan {
  animation: scan 4s linear infinite;
}

.pulse {
  animation: pulse 1.8s ease-in-out infinite;
}

.rotate {
  transform-origin: 600px 215px;
  animation: spin 18s linear infinite;
}

.rotateReverse {
  transform-origin: 600px 215px;
  animation: spinReverse 12s linear infinite;
}

.float1 {
  animation: floating 4s ease-in-out infinite;
}

.float2 {
  animation: floating 5s ease-in-out infinite reverse;
}

.blink {
  animation: blink 1s step-end infinite;
}

@keyframes scan {
  from {
    transform: translateY(-100px);
    opacity: 0;
  }

  15% {
    opacity: .8;
  }

  85% {
    opacity: .8;
  }

  to {
    transform: translateY(520px);
    opacity: 0;
  }
}

@keyframes pulse {
  0%,100% {
    opacity: .25;
  }

  50% {
    opacity: 1;
  }
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

@keyframes spinReverse {
  from {
    transform: rotate(360deg);
  }

  to {
    transform: rotate(0deg);
  }
}

@keyframes floating {
  0%,100% {
    transform: translateY(0px);
  }

  50% {
    transform: translateY(-10px);
  }
}

@keyframes blink {
  0%,49% {
    opacity: 1;
  }

  50%,100% {
    opacity: 0;
  }
}

</style>

<rect width="1200" height="420" rx="24" fill="url(#bg)"/>

<rect width="1200" height="420" rx="24" fill="url(#grid)"/>

<circle cx="600" cy="210" r="380" fill="url(#glow)"/>

<circle cx="55" cy="43" r="6" fill="#FF5F56"/>
<circle cx="77" cy="43" r="6" fill="#FFBD2E"/>
<circle cx="99" cy="43" r="6" fill="#27C93F"/>

