vaibh37@github: ~/profile
</text>

<text x="1030" y="48" class="green">
ONLINE
</text>

<circle
cx="1015"
cy="43"
r="5"
fill="#3FB950"
class="pulse"
/>

<line
x1="35"
y1="68"
x2="1165"
y2="68"
stroke="#30363D"
/>

<circle
cx="600"
cy="215"
r="145"
fill="none"
stroke="#58A6FF"
